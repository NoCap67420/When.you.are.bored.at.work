<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bored at Work · A new game every day</title>
  <meta name="description" content="One new puzzle, game or trivia quiz every day. Five minutes. Nobody has to know.">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span aria-hidden="true">☕</span> Bored at Work</a>
    <nav class="nav">
      <button class="icon-btn" data-open="archive" aria-label="Past puzzles" title="Past puzzles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <button class="icon-btn" data-open="stats" aria-label="Your stats" title="Your stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>
      </button>
      <button class="icon-btn" data-open="help" aria-label="How it works" title="How it works">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
      </button>
    </nav>
  </header>

  <main id="main" class="wrap"></main>

  <footer class="footer">A new game drops every day at midnight. Look busy.</footer>

  <dialog id="dialog">
    <button class="icon-btn close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="dialog-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/games/trivia.js"></script>
  <script src="js/games/scramble.js"></script>
  <script src="js/games/target.js"></script>
  <script src="js/games/pairs.js"></script>
  <script src="js/games/slider.js"></script>
  <script src="js/games/groups.js"></script>
  <script src="js/games/lights.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/emoji.js"></script>
  <script src="js/games/sequence.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
